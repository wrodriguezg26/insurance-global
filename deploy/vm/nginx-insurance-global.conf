# /etc/nginx/sites-available/insurance-global
# Después de activarlo, certbot agrega el bloque 443 y la redirección a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name seguros.t-shits.co;

    root /var/www/insurance-global;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API de correo (Node.js en la misma VM)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # IP real (sin aceptar la que mande el cliente)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
    }

    # Sitio de una sola página
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No servir archivos ocultos (.git, .env, etc.)
    location ~ /\. { deny all; }
}
