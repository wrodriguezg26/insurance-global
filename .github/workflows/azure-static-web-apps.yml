name: Publicar en Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Publicar sitio y API
    steps:
      - uses: actions/checkout@v4

      # Solo los archivos públicos van al sitio. La API (api/) se publica aparte,
      # y db/, deploy/ y README.md no se exponen.
      - name: Preparar archivos públicos
        run: |
          mkdir -p _site
          cp index.html staticwebapp.config.json _site/
          cp -r img _site/

      - name: Desplegar en Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "_site"
          api_location: "api"
          output_location: ""
          skip_app_build: true
